# Production on its own EC2: Caddy (HTTPS), the api, the workers, Postgres and Redis.
#   docker compose -f docker-compose.prod.yml up -d --build
# docker-compose.yml stays the local setup.
#
# The server's .env needs, besides the app settings from .env.example:
#   AGENT_DOMAIN       the public name, e.g. agent.axolo.ai (its DNS must point at this server before the first start)
#   POSTGRES_PASSWORD  a long random password for the database container
# DATABASE_URL and REDIS_URL are set here, so the .env's values for them are not used.
services:
  # The only door from the internet: https on 443 (and 80, which it redirects), passed on to the api.
  caddy:
    image: caddy:2.8.4-alpine
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN:?set AGENT_DOMAIN in .env, e.g. agent.axolo.ai}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here, so a restart reuses them instead of asking Let's Encrypt again.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  # Not reachable from outside the server: no ports are published.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: axolo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: axolo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axolo -d axolo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The job queue. Saved to disk every second, so a restart of Redis keeps jobs that are waiting.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Brings the database to the latest migration, then exits; the api and workers start only once it has finished.
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://axolo:${POSTGRES_PASSWORD}@postgres:5432/axolo
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://axolo:${POSTGRES_PASSWORD}@postgres:5432/axolo
      REDIS_URL: redis://redis:6379/0
    # Reachable from this server only (for curl while debugging); the internet comes in through Caddy.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  # Takes jobs off Redis: copies the client's repo, runs Claude, builds and pushes. Two copies, so one restarting
  # never stops the work.
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://axolo:${POSTGRES_PASSWORD}@postgres:5432/axolo
      REDIS_URL: redis://redis:6379/0
      WORK_ROOT: /work
    command: ["arq", "app.worker.settings.WorkerSettings"]
    deploy:
      replicas: 2
    tmpfs: ["/work:size=4g,uid=10001,gid=10001"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
